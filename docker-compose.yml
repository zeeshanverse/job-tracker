services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [jobtrack_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d jobtrack"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobtrack
      JWT_SECRET: change-this-local-compose-secret-to-a-long-random-value
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  jobtrack_pg:
